<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Từ màu gốc đến token semantic</title><desc id="desc">Luồng chuyển từ blue 500 sang semantic token và Button.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="24" y="36" font-size="28" font-weight="700" fill="#172554">Từ màu gốc đến token semantic</text><text x="24" y="64" font-size="15" fill="#64748B">Component gọi vai trò, không gọi trực tiếp mã màu.</text><g transform="translate(24 104)"><rect width="332" height="140" rx="16" fill="#EFF6FF" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">Color primitive</text><rect x="20" y="62" width="56" height="48" rx="10" fill="#3B82F6"/><text x="92" y="84" font-size="15" font-weight="700" fill="#172554">blue/500</text><text x="92" y="106" font-size="12" fill="#64748B">Màu gốc</text></g><text x="380" y="185" font-size="22" font-weight="700" fill="#2563EB">→</text><g transform="translate(432 104)"><rect width="332" height="140" rx="16" fill="#F8FAFC" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">Semantic token</text><text x="20" y="84" font-size="15" font-weight="700" fill="#172554">color.action.primary</text><text x="20" y="106" font-size="12" fill="#64748B">Vai trò trong sản phẩm</text></g><text x="788" y="185" font-size="22" font-weight="700" fill="#2563EB">→</text><g transform="translate(840 104)"><rect width="336" height="140" rx="16" fill="#F8FAFC" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">Component</text><rect x="20" y="62" width="172" height="44" rx="10" fill="#2563EB"/><text x="44" y="89" font-size="14" font-weight="700" fill="#FFFFFF">Lưu thay đổi</text><text x="20" y="124" font-size="12" fill="#64748B">Button dùng token semantic</text></g></svg>