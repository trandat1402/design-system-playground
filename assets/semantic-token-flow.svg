<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="288" viewBox="0 0 1200 288" role="img" aria-labelledby="t d"><title id="t">Từ màu gốc đến token semantic</title><desc id="d">Dòng chuyển đổi từ blue 500 sang token semantic rồi tới Button.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="0" y="30" font-size="28" font-weight="700" fill="#172554">Từ màu gốc đến token semantic</text><text x="0" y="58" font-size="14" fill="#64748B">Đừng để component gọi trực tiếp <tspan font-family="monospace">blue/500</tspan>.</text><g transform="translate(0 92)"><rect width="300" height="138" rx="16" fill="#EFF6FF"/><text x="20" y="30" font-size="15" font-weight="700" fill="#1E3A8A">Color primitive</text><rect x="20" y="58" width="64" height="44" rx="10" fill="#3B82F6"/><text x="100" y="79" font-size="16" font-weight="700" fill="#172554">blue/500</text><text x="100" y="105" font-size="12" fill="#475569">Màu gốc</text></g><text x="322" y="171" font-size="28" font-weight="700" fill="#2563EB">→</text><g transform="translate(380 92)"><rect width="300" height="138" rx="16" fill="#DBEAFE"/><text x="20" y="30" font-size="15" font-weight="700" fill="#1E3A8A">Semantic token</text><text x="20" y="82" font-size="16" font-weight="700" fill="#172554">color.action.primary</text><text x="20" y="108" font-size="12" fill="#475569">Vai trò trong sản phẩm</text></g><text x="702" y="171" font-size="28" font-weight="700" fill="#2563EB">→</text><g transform="translate(760 92)"><rect width="340" height="138" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/><text x="20" y="30" font-size="15" font-weight="700" fill="#1E3A8A">Component</text><rect x="20" y="61" width="164" height="42" rx="10" fill="#2563EB"/><text x="44" y="87" font-size="14" font-weight="700" fill="#FFF">Lưu thay đổi</text><text x="20" y="119" font-size="12" fill="#475569">Button dùng token semantic</text></g></svg>