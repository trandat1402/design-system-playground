<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Bốn lớp của design system</title><desc id="desc">Foundations, tokens, components và patterns được căn theo lưới 8 point.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="24" y="36" font-size="28" font-weight="700" fill="#172554">Design system là gì?</text><text x="24" y="64" font-size="15" fill="#64748B">Bốn lớp cùng dùng một lưới, một nhịp spacing và một hệ typography.</text><g transform="translate(24 104)"><rect width="270" height="136" rx="16" fill="#EFF6FF" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">01  Foundations</text><text x="20" y="62" font-size="13" fill="#334155">Màu sắc, font, spacing</text><text x="20" y="88" font-size="13" fill="#334155">border radius, elevation</text><text x="20" y="116" font-size="12" fill="#64748B">Quy tắc nền tảng</text></g><text x="300" y="184" font-size="22" font-weight="700" fill="#2563EB">→</text><g transform="translate(318 104)"><rect width="270" height="136" rx="16" fill="#F8FAFC" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">02  Tokens</text><text x="20" y="62" font-size="13" fill="#334155">color, spacing, typography</text><text x="20" y="88" font-size="13" fill="#334155">được đặt tên có nghĩa</text><text x="20" y="116" font-size="12" fill="#64748B">Ngôn ngữ chung</text></g><text x="594" y="184" font-size="22" font-weight="700" fill="#2563EB">→</text><g transform="translate(612 104)"><rect width="270" height="136" rx="16" fill="#F8FAFC" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">03  Components</text><text x="20" y="62" font-size="13" fill="#334155">Button, Input, Alert</text><text x="20" y="88" font-size="13" fill="#334155">Table, Modal, Select</text><text x="20" y="116" font-size="12" fill="#64748B">Khối UI tái sử dụng</text></g><text x="888" y="184" font-size="22" font-weight="700" fill="#2563EB">→</text><g transform="translate(906 104)"><rect width="270" height="136" rx="16" fill="#F8FAFC" stroke="#DBEAFE"/><text x="20" y="32" font-size="16" font-weight="700" fill="#1E3A8A">04  Patterns</text><text x="20" y="62" font-size="13" fill="#334155">Form, filter, empty state</text><text x="20" y="88" font-size="13" fill="#334155">dashboard, workflow</text><text x="20" y="116" font-size="12" fill="#64748B">Cách ghép component</text></g><text x="24" y="284" font-size="13" fill="#475569">Lời khuyên: thống nhất foundations trước, rồi mới mở rộng component.</text></svg>