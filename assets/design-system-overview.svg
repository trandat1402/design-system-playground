<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Design system là gì</title><desc id="d">Bốn lớp foundations, tokens, components và patterns trong design system.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="0" y="30" font-size="28" font-weight="700" fill="#172554">Design system là gì?</text><text x="0" y="58" font-size="14" fill="#64748B">Một cách làm chung để đội ngũ tạo giao diện nhất quán.</text><g><g transform="translate(0 95)"><rect width="270" height="132" rx="16" fill="#EFF6FF"/><text x="20" y="42" font-size="18" font-weight="700" fill="#1E3A8A">1. Foundations</text><text x="20" y="76" font-size="13" fill="#334155">Màu sắc, font, spacing</text><text x="20" y="101" font-size="12" fill="#64748B">Quy tắc nền tảng</text></g><text x="278" y="168" font-size="26" font-weight="700" fill="#2563EB">→</text><g transform="translate(306 95)"><rect width="270" height="132" rx="16" fill="#DBEAFE"/><text x="20" y="42" font-size="18" font-weight="700" fill="#1D4ED8">2. Tokens</text><text x="20" y="76" font-size="13" fill="#334155">primary, text, border</text><text x="20" y="101" font-size="12" fill="#64748B">Tên có ý nghĩa</text></g><text x="584" y="168" font-size="26" font-weight="700" fill="#2563EB">→</text><g transform="translate(612 95)"><rect width="270" height="132" rx="16" fill="#BFDBFE"/><text x="20" y="42" font-size="18" font-weight="700" fill="#1E40AF">3. Components</text><text x="20" y="76" font-size="13" fill="#334155">Button, input, alert</text><text x="20" y="101" font-size="12" fill="#64748B">Các khối UI tái dùng</text></g><text x="890" y="168" font-size="26" font-weight="700" fill="#2563EB">→</text><g transform="translate(918 95)"><rect width="270" height="132" rx="16" fill="#93C5FD"/><text x="20" y="42" font-size="18" font-weight="700" fill="#1E3A8A">4. Patterns</text><text x="20" y="76" font-size="13" fill="#334155">Form, filter, empty state</text><text x="20" y="101" font-size="12" fill="#475569">Cách ghép component</text></g></g><text x="0" y="270" font-size="14" fill="#475569">Bắt đầu nhỏ: thống nhất foundations trước, rồi mới chuẩn hóa component.</text></svg>