<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">TailGrids primary blue scale</title><desc id="desc">Thang màu primary, selected và hover theo TailGrids v3.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#090E34" flood-opacity=".10"/></filter></defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:30px;font-weight:700;letter-spacing:-.02em;fill:#090E34}.sub{font-size:14px;fill:#6B7280}.name{font-size:14px;font-weight:600;fill:#1F2937}.hex{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;fill:#6B7280}.role{font-size:12px;font-weight:500;fill:#6B7280}</style><rect width="1200" height="340" fill="#F9FAFB"/><text class="h" x="48" y="52">Primary blue, used with intent</text><text class="sub" x="48" y="84">TailGrids v3 uses blue for actions and active states, not as decoration.</text><rect x="48" y="120" width="1104" height="168" rx="8" fill="#FFF" stroke="#E5E7EB" filter="url(#s)"/><g transform="translate(72 152)"><rect width="192" height="72" rx="8" fill="#EEF2FF"/><text class="name" x="0" y="100">Primary Light</text><text class="hex" x="0" y="122">#EEF2FF</text><text class="role" x="0" y="144">Selected surface</text></g><g transform="translate(288 152)"><rect width="192" height="72" rx="8" fill="#C7D2FE"/><text class="name" x="0" y="100">Primary Soft</text><text class="hex" x="0" y="122">#C7D2FE</text><text class="role" x="0" y="144">Supporting tint</text></g><g transform="translate(504 152)"><rect width="192" height="72" rx="8" fill="#7586FA"/><text class="name" x="0" y="100">Primary Mid</text><text class="hex" x="0" y="122">#7586FA</text><text class="role" x="0" y="144">Visual bridge</text></g><g transform="translate(720 152)"><rect width="192" height="72" rx="8" fill="#3758F9"/><text class="name" x="0" y="100">Primary</text><text class="hex" x="0" y="122">#3758F9</text><text class="role" x="0" y="144">Main action</text></g><g transform="translate(936 152)"><rect width="192" height="72" rx="8" fill="#1B44C8"/><text class="name" x="0" y="100">Primary Dark</text><text class="hex" x="0" y="122">#1B44C8</text><text class="role" x="0" y="144">Hover / pressed</text></g></svg>