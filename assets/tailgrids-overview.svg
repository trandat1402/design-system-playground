<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Design system workflow</title><desc id="desc">Minh họa design system theo TailGrids v3, dùng Inter, nền xám nhạt, card trắng, accent xanh indigo và lưới spacing 8px.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#090E34" flood-opacity=".10"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#090E34" flood-opacity=".06"/></filter></defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.title{font-size:30px;font-weight:700;letter-spacing:-.02em;fill:#090E34}.subtitle{font-size:14px;font-weight:400;fill:#6B7280}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;fill:#3758F9}.card-title{font-size:16px;font-weight:600;letter-spacing:-.01em;fill:#1F2937}.body{font-size:13px;font-weight:400;fill:#6B7280}.button{font-size:13px;font-weight:500;fill:#FFFFFF}</style><rect width="1200" height="360" fill="#F9FAFB"/><text class="title" x="48" y="52">How a design system scales</text><text class="subtitle" x="48" y="84">TailGrids v3: neutral-first surfaces, precise typography and one confident primary action.</text><rect x="48" y="120" width="1104" height="192" rx="8" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/><g transform="translate(72 144)"><rect width="320" height="144" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="16" y="16" width="40" height="24" rx="4" fill="#EEF2FF"/><text class="eyebrow" x="26" y="32">01</text><text class="card-title" x="16" y="70">Foundations</text><text class="body" x="16" y="96">Color, type, spacing</text><text class="body" x="16" y="118">and surface rules</text></g><text x="403" y="222" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="600" fill="#3758F9">→</text><g transform="translate(440 144)"><rect width="320" height="144" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="16" y="16" width="40" height="24" rx="4" fill="#EEF2FF"/><text class="eyebrow" x="26" y="32">02</text><text class="card-title" x="16" y="70">Semantic tokens</text><text x="16" y="96" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="500" fill="#374151">color.action.primary</text><text class="body" x="16" y="118">Role, not a raw hex value</text></g><text x="771" y="222" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="600" fill="#3758F9">→</text><g transform="translate(808 144)"><rect width="320" height="144" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="16" y="16" width="40" height="24" rx="4" fill="#EEF2FF"/><text class="eyebrow" x="26" y="32">03</text><text class="card-title" x="16" y="70">Components</text><text class="body" x="16" y="96">Reusable UI with clear</text><text class="body" x="16" y="118">states and behavior</text><rect x="184" y="92" width="112" height="36" rx="8" fill="#3758F9"/><text class="button" x="210" y="115">Primary</text></g></svg>