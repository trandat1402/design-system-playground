<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Primary Button states</title><desc id="desc">Default, hover và disabled theo token TailGrids v3.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#090E34" flood-opacity=".10"/></filter></defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:30px;font-weight:700;letter-spacing:-.02em;fill:#090E34}.sub{font-size:14px;fill:#6B7280}.label{font-size:12px;font-weight:600;letter-spacing:.05em;fill:#3758F9}.ct{font-size:16px;font-weight:600;letter-spacing:-.01em;fill:#1F2937}.body{font-size:13px;fill:#6B7280}.btn{font-size:14px;font-weight:500}</style><rect width="1200" height="360" fill="#F9FAFB"/><text class="h" x="48" y="52">A component needs states</text><text class="sub" x="48" y="84">Same anatomy and spacing. Only color and feedback change with interaction context.</text><rect x="48" y="120" width="1104" height="192" rx="8" fill="#FFF" stroke="#E5E7EB" filter="url(#s)"/><g transform="translate(72 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="72" height="24" rx="4" fill="#EEF2FF"/><text class="label" x="26" y="32">DEFAULT</text><text class="ct" x="16" y="72">Ready to act</text><rect x="16" y="92" width="152" height="40" rx="8" fill="#3758F9"/><text class="btn" x="49" y="117" fill="#FFF">Save changes</text></g><g transform="translate(440 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="64" height="24" rx="4" fill="#EEF2FF"/><text class="label" x="26" y="32">HOVER</text><text class="ct" x="16" y="72">Confirm interaction</text><rect x="16" y="92" width="152" height="40" rx="8" fill="#1B44C8"/><text class="btn" x="49" y="117" fill="#FFF">Save changes</text></g><g transform="translate(808 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="80" height="24" rx="4" fill="#F3F4F6"/><text x="26" y="32" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing=".05em" fill="#6B7280">DISABLED</text><text class="ct" x="16" y="72">Unavailable now</text><rect x="16" y="92" width="152" height="40" rx="8" fill="#D1D5DB"/><text class="btn" x="49" y="117" fill="#6B7280">Save changes</text></g></svg>