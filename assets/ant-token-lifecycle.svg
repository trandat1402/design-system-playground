<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Vòng đời token trong Ant Design</title><desc id="d">Seed Token sinh Map Token, Map Token dẫn đến Alias Token và Component Token.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.ey{font-size:12px;font-weight:600;fill:rgba(0,0,0,.45)}.title{font-size:17px;font-weight:600;fill:rgba(0,0,0,.88)}.body{font-size:12px;fill:rgba(0,0,0,.65)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="360" fill="#f5f5f5"/><text class="h" x="60" y="48">Vòng đời token trong Ant Design</text><text class="sub" x="60" y="80">Tùy biến từ lớp gốc trước, chỉ đi sâu hơn khi thật sự cần.</text><path d="M 312 212 H 336 M 588 212 H 612 M 864 212 H 888" stroke="#d9d9d9" stroke-width="2"/><path d="M 328 205 L 336 212 L 328 219 M 604 205 L 612 212 L 604 219 M 880 205 L 888 212 L 880 219" fill="none" stroke="#d9d9d9" stroke-width="2"/><g><rect x="60" y="128" width="252" height="168" rx="8" fill="#e6f4ff" stroke="#91caff"/><text class="ey" x="84" y="156">SEED TOKEN</text><text class="title" x="84" y="188">Ý định gốc</text><rect x="84" y="212" width="204" height="32" rx="6" fill="#fff"/><text class="mono" x="100" y="228">colorPrimary</text><text class="body" x="84" y="272">Nguồn của hệ màu và kích thước</text></g><g><rect x="336" y="128" width="252" height="168" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="360" y="156">MAP TOKEN</text><text class="title" x="360" y="188">Giá trị dẫn xuất</text><rect x="360" y="212" width="204" height="32" rx="6" fill="#f5f5f5"/><text class="mono" x="376" y="228">colorPrimaryBg</text><text class="body" x="360" y="272">Được thuật toán sinh từ Seed</text></g><g><rect x="612" y="128" width="252" height="168" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="636" y="156">ALIAS TOKEN</text><text class="title" x="636" y="188">Vai trò dùng chung</text><rect x="636" y="212" width="204" height="32" rx="6" fill="#f5f5f5"/><text class="mono" x="652" y="228">colorLink</text><text class="body" x="636" y="272">Áp dụng xuyên nhiều component</text></g><g><rect x="888" y="128" width="252" height="168" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="912" y="156">COMPONENT TOKEN</text><text class="title" x="912" y="188">Điều chỉnh cục bộ</text><rect x="912" y="212" width="204" height="32" rx="6" fill="#f5f5f5"/><text class="mono" x="928" y="228">Button tokens</text><text class="body" x="912" y="272">Chỉ ảnh hưởng component cụ thể</text></g></svg>