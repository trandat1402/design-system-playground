<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="Ba variant Button theo muc do quan trong cua hanh dong">
  <rect width="1200" height="340" fill="#FFFFFF"/>
  <text x="64" y="64" font-size="32" font-weight="600" fill="#161616">Chọn Button theo mức độ quan trọng của hành động</text>
  <text x="64" y="100" font-size="17" fill="#525252">Cùng một hình chữ nhật, nhưng mỗi variant nói với người dùng một điều khác nhau</text>
  <g transform="translate(64 140)">
    <rect width="304" height="136" rx="8" fill="#F4F4F4" stroke="#E0E0E0"/>
    <text x="20" y="34" font-size="16" font-weight="600" fill="#161616">Primary</text>
    <rect x="20" y="50" width="160" height="40" fill="#0F62FE"/>
    <text x="100" y="75" font-size="16" fill="#FFFFFF" text-anchor="middle">Lưu</text>
    <text x="20" y="114" font-size="14" fill="#525252">Hành động chính của màn hình</text>
  </g>
  <g transform="translate(448 140)">
    <rect width="304" height="136" rx="8" fill="#F4F4F4" stroke="#E0E0E0"/>
    <text x="20" y="34" font-size="16" font-weight="600" fill="#161616">Secondary</text>
    <rect x="20" y="50" width="160" height="40" fill="#FFFFFF" stroke="#0F62FE" stroke-width="1.5"/>
    <text x="100" y="75" font-size="16" fill="#0F62FE" text-anchor="middle">Hủy</text>
    <text x="20" y="114" font-size="14" fill="#525252">Hành động phụ, không mất dữ liệu</text>
  </g>
  <g transform="translate(832 140)">
    <rect width="304" height="136" rx="8" fill="#F4F4F4" stroke="#E0E0E0"/>
    <text x="20" y="34" font-size="16" font-weight="600" fill="#161616">Danger</text>
    <rect x="20" y="50" width="160" height="40" fill="#DA1E28"/>
    <text x="100" y="75" font-size="16" fill="#FFFFFF" text-anchor="middle">Xóa tài khoản</text>
    <text x="20" y="114" font-size="14" fill="#525252">Hành động khó hoàn tác</text>
  </g>
  <text x="64" y="304" font-size="15" fill="#525252">Trước khi chọn variant, hãy hỏi: hành động này quan trọng đến mức nào?</text>
</svg>
