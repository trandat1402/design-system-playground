<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Ant Design blue palette</title><desc id="d">Mười cấp blue của Ant Design, mỗi ô có nhãn và mã màu theo cùng một cấu trúc.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.name{font-size:12px;font-weight:600;fill:rgba(0,0,0,.88)}.hex{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="330" fill="#f5f5f5"/><text class="h" x="48" y="48">Blue palette chính thức</text><text class="sub" x="48" y="80">Mỗi cấp dùng cùng một cấu trúc: tên palette và mã hex.</text><g transform="translate(48 140)"><rect width="102" height="76" rx="6" fill="#e6f4ff"/><text class="name" x="51" y="238" text-anchor="middle">blue-1</text><text class="hex" x="51" y="262" text-anchor="middle">#E6F4FF</text></g><g transform="translate(158 140)"><rect width="102" height="76" rx="6" fill="#bae0ff"/><text class="name" x="51" y="238" text-anchor="middle">blue-2</text><text class="hex" x="51" y="262" text-anchor="middle">#BAE0FF</text></g><g transform="translate(268 140)"><rect width="102" height="76" rx="6" fill="#91caff"/><text class="name" x="51" y="238" text-anchor="middle">blue-3</text><text class="hex" x="51" y="262" text-anchor="middle">#91CAFF</text></g><g transform="translate(378 140)"><rect width="102" height="76" rx="6" fill="#69b1ff"/><text class="name" x="51" y="238" text-anchor="middle">blue-4</text><text class="hex" x="51" y="262" text-anchor="middle">#69B1FF</text></g><g transform="translate(488 140)"><rect width="102" height="76" rx="6" fill="#4096ff"/><text class="name" x="51" y="238" text-anchor="middle">blue-5</text><text class="hex" x="51" y="262" text-anchor="middle">#4096FF</text></g><g transform="translate(598 140)"><rect width="102" height="76" rx="6" fill="#1677ff" stroke="#0958d9" stroke-width="3"/><text class="name" x="51" y="238" text-anchor="middle">blue-6</text><text class="hex" x="51" y="262" text-anchor="middle">#1677FF</text></g><g transform="translate(708 140)"><rect width="102" height="76" rx="6" fill="#0958d9"/><text class="name" x="51" y="238" text-anchor="middle">blue-7</text><text class="hex" x="51" y="262" text-anchor="middle">#0958D9</text></g><g transform="translate(818 140)"><rect width="102" height="76" rx="6" fill="#003eb3"/><text class="name" x="51" y="238" text-anchor="middle">blue-8</text><text class="hex" x="51" y="262" text-anchor="middle">#003EB3</text></g><g transform="translate(928 140)"><rect width="102" height="76" rx="6" fill="#002c8c"/><text class="name" x="51" y="238" text-anchor="middle">blue-9</text><text class="hex" x="51" y="262" text-anchor="middle">#002C8C</text></g><g transform="translate(1038 140)"><rect width="102" height="76" rx="6" fill="#001d66"/><text class="name" x="51" y="238" text-anchor="middle">blue-10</text><text class="hex" x="51" y="262" text-anchor="middle">#001D66</text></g></svg>