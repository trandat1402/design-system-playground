<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Ant Design blue palette</title><desc id="d">Mười cấp blue Ant Design với nhãn căn trục giữa mỗi swatch.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.num{font-size:11px;font-weight:500;fill:rgba(0,0,0,.65)}.hex{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10px;fill:rgba(0,0,0,.65)}.on{font-size:11px;font-weight:500;fill:#fff}</style><rect width="1200" height="330" fill="#f5f5f5"/><text class="h" x="48" y="48">Blue palette của Ant Design</text><text class="sub" x="48" y="80">Blue-6 là brand color mặc định: #1677FF.</text><g><rect x="48" y="128" width="96" height="72" rx="6" fill="#e6f4ff"/><text class="num" text-anchor="middle" x="96" y="220">blue-1</text><text class="hex" text-anchor="middle" x="96" y="240">#E6F4FF</text><rect x="160" y="128" width="96" height="72" rx="6" fill="#bae0ff"/><text class="num" text-anchor="middle" x="208" y="220">blue-2</text><text class="hex" text-anchor="middle" x="208" y="240">#BAE0FF</text><rect x="272" y="128" width="96" height="72" rx="6" fill="#91caff"/><text class="num" text-anchor="middle" x="320" y="220">blue-3</text><text class="hex" text-anchor="middle" x="320" y="240">#91CAFF</text><rect x="384" y="128" width="96" height="72" rx="6" fill="#69b1ff"/><text class="num" text-anchor="middle" x="432" y="220">blue-4</text><text class="hex" text-anchor="middle" x="432" y="240">#69B1FF</text><rect x="496" y="128" width="96" height="72" rx="6" fill="#4096ff"/><text class="num" text-anchor="middle" x="544" y="220">blue-5</text><text class="hex" text-anchor="middle" x="544" y="240">#4096FF</text><rect x="608" y="128" width="96" height="72" rx="6" fill="#1677ff"/><text class="on" text-anchor="middle" x="656" y="164">blue-6</text><text class="num" text-anchor="middle" x="656" y="220">Primary</text><text class="hex" text-anchor="middle" x="656" y="240">#1677FF</text><rect x="720" y="128" width="96" height="72" rx="6" fill="#0958d9"/><text class="on" text-anchor="middle" x="768" y="164">blue-7</text><text class="num" text-anchor="middle" x="768" y="220">Active</text><text class="hex" text-anchor="middle" x="768" y="240">#0958D9</text><rect x="832" y="128" width="96" height="72" rx="6" fill="#003eb3"/><text class="on" text-anchor="middle" x="880" y="164">blue-8</text><text class="num" text-anchor="middle" x="880" y="220">blue-8</text><text class="hex" text-anchor="middle" x="880" y="240">#003EB3</text><rect x="944" y="128" width="96" height="72" rx="6" fill="#002c8c"/><text class="on" text-anchor="middle" x="992" y="164">blue-9</text><text class="num" text-anchor="middle" x="992" y="220">blue-9</text><text class="hex" text-anchor="middle" x="992" y="240">#002C8C</text><rect x="1056" y="128" width="96" height="72" rx="6" fill="#001d66"/><text class="on" text-anchor="middle" x="1104" y="164">blue-10</text><text class="num" text-anchor="middle" x="1104" y="220">blue-10</text><text class="hex" text-anchor="middle" x="1104" y="240">#001D66</text></g><text class="sub" x="48" y="292">Các label được đặt trên cùng baseline và căn giữa theo tâm từng swatch.</text></svg>