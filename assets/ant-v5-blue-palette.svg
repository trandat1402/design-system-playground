<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Ant Design blue palette</title><desc id="d">Mười cấp màu blue chính thức của Ant Design v5, từ blue-1 đến blue-10.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.num{font-size:12px;font-weight:500;fill:rgba(0,0,0,.65)}.hex{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;fill:rgba(0,0,0,.65)}.on{font-size:12px;font-weight:500;fill:#fff}</style><rect width="1200" height="330" fill="#f5f5f5"/><text class="h" x="48" y="52">Blue palette của Ant Design</text><text class="sub" x="48" y="82">Blue-6 là brand color mặc định: #1677FF.</text><g transform="translate(48 128)"><rect width="104" height="72" rx="6" fill="#e6f4ff"/><text class="num" x="0" y="102">blue-1</text><text class="hex" x="0" y="124">#E6F4FF</text></g><g transform="translate(160 128)"><rect width="104" height="72" rx="6" fill="#bae0ff"/><text class="num" x="0" y="102">blue-2</text><text class="hex" x="0" y="124">#BAE0FF</text></g><g transform="translate(272 128)"><rect width="104" height="72" rx="6" fill="#91caff"/><text class="num" x="0" y="102">blue-3</text><text class="hex" x="0" y="124">#91CAFF</text></g><g transform="translate(384 128)"><rect width="104" height="72" rx="6" fill="#69b1ff"/><text class="num" x="0" y="102">blue-4</text><text class="hex" x="0" y="124">#69B1FF</text></g><g transform="translate(496 128)"><rect width="104" height="72" rx="6" fill="#4096ff"/><text class="num" x="0" y="102">blue-5</text><text class="hex" x="0" y="124">#4096FF</text></g><g transform="translate(608 128)"><rect width="104" height="72" rx="6" fill="#1677ff"/><text class="on" x="34" y="42">blue-6</text><text class="num" x="0" y="102">Primary</text><text class="hex" x="0" y="124">#1677FF</text></g><g transform="translate(720 128)"><rect width="104" height="72" rx="6" fill="#0958d9"/><text class="on" x="34" y="42">blue-7</text><text class="num" x="0" y="102">Active</text><text class="hex" x="0" y="124">#0958D9</text></g><g transform="translate(832 128)"><rect width="104" height="72" rx="6" fill="#003eb3"/><text class="on" x="34" y="42">blue-8</text><text class="num" x="0" y="102">blue-8</text><text class="hex" x="0" y="124">#003EB3</text></g><g transform="translate(944 128)"><rect width="104" height="72" rx="6" fill="#002c8c"/><text class="on" x="34" y="42">blue-9</text><text class="num" x="0" y="102">blue-9</text><text class="hex" x="0" y="124">#002C8C</text></g><g transform="translate(1056 128)"><rect width="96" height="72" rx="6" fill="#001d66"/><text class="on" x="28" y="42">blue-10</text><text class="num" x="0" y="102">blue-10</text><text class="hex" x="0" y="124">#001D66</text></g><text class="sub" x="48" y="292">Dùng màu theo semantic token và state, thay vì rải toàn bộ palette vào cùng một màn hình.</text></svg>