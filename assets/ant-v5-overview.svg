<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Hệ màu Ant Design</title><desc id="d">System palette đến product token và component, căn theo baseline grid.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.label{font-size:12px;font-weight:500;fill:rgba(0,0,0,.65)}.title{font-size:16px;font-weight:600;fill:rgba(0,0,0,.88)}.body{font-size:13px;fill:rgba(0,0,0,.65)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="340" fill="#f5f5f5"/><text class="h" x="48" y="48">Hệ màu Ant Design</text><text class="sub" x="48" y="80">System palette → product token → component</text><rect x="48" y="112" width="1104" height="180" rx="8" fill="#fff" stroke="#f0f0f0"/><g><rect x="80" y="144" width="276" height="116" rx="6" fill="#e6f4ff"/><circle cx="166" cy="190" r="24" fill="#1677ff"/><circle cx="206" cy="202" r="24" fill="#4096ff"/><circle cx="246" cy="178" r="24" fill="#0958d9"/><text class="title" text-anchor="middle" x="218" y="232">System palette</text></g><path d="M 388 202 H 470" stroke="#d9d9d9" stroke-width="2"/><path d="M 460 195 L 470 202 L 460 209" fill="none" stroke="#d9d9d9" stroke-width="2"/><g><rect x="502" y="144" width="276" height="116" rx="6" fill="#fff" stroke="#d9d9d9"/><text class="label" text-anchor="middle" x="640" y="172">SEMANTIC TOKEN</text><text class="title" text-anchor="middle" x="640" y="202">colorPrimary</text><text class="mono" text-anchor="middle" x="640" y="230">#1677FF</text></g><path d="M 810 202 H 892" stroke="#d9d9d9" stroke-width="2"/><path d="M 882 195 L 892 202 L 882 209" fill="none" stroke="#d9d9d9" stroke-width="2"/><g><rect x="924" y="144" width="196" height="116" rx="6" fill="#fff" stroke="#d9d9d9"/><text class="label" text-anchor="middle" x="1022" y="172">COMPONENT</text><rect x="952" y="190" width="140" height="32" rx="6" fill="#1677ff"/><text text-anchor="middle" x="1022" y="206" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="body" text-anchor="middle" x="1022" y="242">Button</text></g></svg>