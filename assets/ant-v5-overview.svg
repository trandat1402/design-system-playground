<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Các lớp của Ant Design</title><desc id="d">Foundation, token, component và pattern được nối bằng connector xám.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.ey{font-size:12px;font-weight:600;fill:rgba(0,0,0,.45)}.name{font-size:17px;font-weight:600;fill:rgba(0,0,0,.88)}.body{font-size:13px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="340" fill="#f5f5f5"/><text class="h" x="48" y="48">Các lớp của Ant Design</text><text class="sub" x="48" y="80">Một hệ thống đi từ quy tắc nền đến luồng trải nghiệm hoàn chỉnh.</text><line x1="252" y1="196" x2="948" y2="196" stroke="#d9d9d9" stroke-width="2"/><path d="M 351 189 L 365 196 L 351 203 M 539 189 L 553 196 L 539 203 M 741 189 L 755 196 L 741 203" fill="none" stroke="#d9d9d9" stroke-width="2"/><g><rect x="48" y="144" width="204" height="104" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="72" y="170">01 · FOUNDATION</text><text class="name" x="72" y="198">Foundations</text><text class="body" x="72" y="222">Color · type · spacing</text></g><g><rect x="365" y="144" width="174" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text class="ey" x="389" y="170">02 · TOKEN</text><text class="name" x="389" y="198">Tokens</text><text class="body" x="389" y="222">colorPrimary</text></g><g><rect x="553" y="144" width="188" height="104" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="577" y="170">03 · COMPONENT</text><text class="name" x="577" y="198">Components</text><text class="body" x="577" y="222">Button · Alert · Input</text></g><g><rect x="755" y="144" width="206" height="104" rx="8" fill="#fff" stroke="#d9d9d9"/><text class="ey" x="779" y="170">04 · PATTERN</text><