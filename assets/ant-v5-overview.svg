<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Hệ màu Ant Design</title><desc id="d">System palette đến product token và component với khoảng thở rõ giữa hình và chữ.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.label{font-size:12px;font-weight:500;fill:rgba(0,0,0,.65)}.title{font-size:16px;font-weight:600;fill:rgba(0,0,0,.88)}.body{font-size:13px;fill:rgba(0,0,0,.65)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="340" fill="#f5f5f5"/><text class="h" x="48" y="48">Hệ màu Ant Design</text><text class="sub" x="48" y="80">System palette → product token → component</text><rect x="48" y="112" width="1104" height="180" rx="8" fill="#fff" stroke="#f0f0f0"/><path d="M 360 202 H 460 M 740 202 H 840" stroke="#d9d9d9" stroke-width="2"/><path d="M 450 195 L 460 202 L 450 209 M 830 195 L 840 202 L 830 209" fill="none" stroke="#d9d9d9" stroke-width="2"/><g><rect x="80" y="144" width="280" height="116" rx="6" fill="#e6f4ff"/><circle cx="184" cy="180" r="18" fill="#1677ff"/><circle cx="220" cy="190" r="18" fill="#4096ff"/><circle cx="256" cy="174" r="18" fill="#0958d9"/><text class="title" text-anchor="middle" x="220" y="232">System palette</text></g><g><rect x="460" y="144" width="280" height="116" rx="6" fill="#fff" stroke="#d9d9d9"/><text class="label" text-anchor="middle" x="600" y="170">SEMANTIC TOKEN</text><text class="title" text-anchor="middle" x="600" y="200">colorPrimary</text><text class="mono" text-anchor="middle" x="600" y="232">#1677FF</text></g><g><rect x="840" y="144" width="280" height="116" rx="6" fill="#fff" stroke="#d9d9d9"/><text class="label" text-anchor="middle" x="980" y="170">COMPONENT</text><rect x="918" y="186" width="124" height="28" rx="6" fill="#1677ff"/><text text-anchor="middle" x="980" y="200" font-size="13" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="body" text-anchor="middle" x="980" y="240">Button</text></g></svg>