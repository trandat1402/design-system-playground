<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="t d"><title id="t">Các state của Button</title><desc id="d">Ba trạng thái default, hover và disabled của cùng một button.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="0" y="30" font-size="28" font-weight="700" fill="#172554">Một component cần có state</text><text x="0" y="58" font-size="14" fill="#64748B">Cùng là Button, nhưng mỗi trạng thái phải truyền đạt phản hồi khác nhau.</text><g><g transform="translate(0 94)"><rect width="320" height="126" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="31" font-size="16" font-weight="700" fill="#172554">Default</text><rect x="20" y="56" width="178" height="42" rx="10" fill="#2563EB"/><text x="44" y="82" font-size="14" font-weight="700" fill="#FFF">Lưu thay đổi</text><text x="20" y="114" font-size="12" fill="#475569">Sẵn sàng để bấm</text></g><g transform="translate(360 94)"><rect width="320" height="126" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="31" font-size="16" font-weight="700" fill="#172554">Hover</text><rect x="20" y="56" width="178" height="42" rx="10" fill="#1D4ED8"/><text x="44" y="82" font-size="14" font-weight="700" fill="#FFF">Lưu thay đổi</text><text x="20" y="114" font-size="12" fill="#475569">Phản hồi khi rê chuột</text></g><g transform="translate(720 94)"><rect width="320" height="126" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="31" font-size="16" font-weight="700" fill="#172554">Disabled</text><rect x="20" y="56" width="178" height="42" rx="10" fill="#BFDBFE"/><text x="44" y="82" font-size="14" font-weight="700" fill="#64748B">Lưu thay đổi</text><text x="20" y="114" font-size="12" fill="#475569">Không thể thao tác</text></g></g><text x="0" y="264" font-size="14" fill="#475569">Khi tài liệu hóa component, hãy ghi rõ state, mục đích và khi nào dùng.</text></svg>