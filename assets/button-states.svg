<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Ba trạng thái của Button</title><desc id="desc">Default, hover và disabled được căn chỉnh trên cùng một lưới.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;display=swap');text{font-family:'Noto Sans',Arial,sans-serif}</style><text x="24" y="36" font-size="28" font-weight="700" fill="#172554">Một component cần có state</text><text x="24" y="64" font-size="15" fill="#64748B">Cùng một Button, nhưng màu và phản hồi thay đổi theo ngữ cảnh.</text><g transform="translate(24 104)"><rect width="368" height="140" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="32" font-size="16" font-weight="700" fill="#172554">Default</text><rect x="20" y="62" width="184" height="44" rx="10" fill="#2563EB"/><text x="44" y="89" font-size="14" font-weight="700" fill="#FFF">Lưu thay đổi</text><text x="20" y="124" font-size="12" fill="#64748B">Sẵn sàng để bấm</text></g><g transform="translate(416 104)"><rect width="368" height="140" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="32" font-size="16" font-weight="700" fill="#172554">Hover</text><rect x="20" y="62" width="184" height="44" rx="10" fill="#1D4ED8"/><text x="44" y="89" font-size="14" font-weight="700" fill="#FFF">Lưu thay đổi</text><text x="20" y="124" font-size="12" fill="#64748B">Phản hồi khi rê chuột</text></g><g transform="translate(808 104)"><rect width="368" height="140" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/><text x="20" y="32" font-size="16" font-weight="700" fill="#172554">Disabled</text><rect x="20" y="62" width="184" height="44" rx="10" fill="#BFDBFE"/><text x="44" y="89" font-size="14" font-weight="700" fill="#64748B">Lưu thay đổi</text><text x="20" y="124" font-size="12" fill="#64748B">Không thể thao tác</text></g><text x="24" y="280" font-size="13" fill="#475569">Cả ba state dùng chung component anatomy, spacing và typography.</text></svg>