<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="218" viewBox="0 0 1200 218" role="img" aria-labelledby="title desc">
  <title id="title">Blue color scale</title>
  <desc id="desc">Thang màu blue từ 50 đến 900 với vai trò sử dụng trong design system.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&amp;display=swap'); text{font-family:'Noto Sans',Arial,sans-serif}</style>
  <text x="0" y="28" font-size="24" font-weight="700" fill="#172554">Blue color scale</text>
  <text x="0" y="54" font-size="13" fill="#64748B">Từ nền rất nhạt đến tương phản cao</text>
  <g>
    <g transform="translate(0 80)"><rect width="106" height="112" rx="10" fill="#EFF6FF"/><text x="12" y="39" font-size="14" font-weight="700" fill="#172554">blue/50</text><text x="12" y="67" font-size="11" fill="#172554">Nền rất nhạt</text></g>
    <g transform="translate(114 80)"><rect width="106" height="112" rx="10" fill="#DBEAFE"/><text x="12" y="39" font-size="14" font-weight="700" fill="#172554">blue/100</text><text x="12" y="67" font-size="11" fill="#172554">Nền subtle</text></g>
    <g transform="translate(228 80)"><rect width="106" height="112" rx="10" fill="#BFDBFE"/><text x="12" y="39" font-size="14" font-weight="700" fill="#172554">blue/200</text><text x="12" y="67" font-size="11" fill="#172554">Nền chọn nhẹ</text></g>
    <g transform="translate(342 80)"><rect width="106" height="112" rx="10" fill="#93C5FD"/><text x="12" y="39" font-size="14" font-weight="700" fill="#172554">blue/300</text><text x="12" y="67" font-size="11" fill="#172554">Viền hoặc</text><text x="12" y="83" font-size="11" fill="#172554">disabled</text></g>
    <g transform="translate(456 80)"><rect width="106" height="112" rx="10" fill="#60A5FA"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/400</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Icon nhẹ</text></g>
    <g transform="translate(570 80)"><rect width="106" height="112" rx="10" fill="#3B82F6"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/500</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Action chính</text></g>
    <g transform="translate(684 80)"><rect width="106" height="112" rx="10" fill="#2563EB"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/600</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Hover</text></g>
    <g transform="translate(798 80)"><rect width="106" height="112" rx="10" fill="#1D4ED8"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/700</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Pressed hoặc</text><text x="12" y="83" font-size="11" fill="#FFFFFF">text</text></g>
    <g transform="translate(912 80)"><rect width="106" height="112" rx="10" fill="#1E40AF"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/800</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Text đậm</text></g>
    <g transform="translate(1026 80)"><rect width="106" height="112" rx="10" fill="#1E3A8A"/><text x="12" y="39" font-size="14" font-weight="700" fill="#FFFFFF">blue/900</text><text x="12" y="67" font-size="11" fill="#FFFFFF">Tương phản</text><text x="12" y="83" font-size="11" fill="#FFFFFF">cao</text></g>
  </g>
</svg>