<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="Bon trang thai cua Input: default, focus, error, disabled">
  <rect width="1200" height="360" fill="#FFFFFF"/>
  <text x="64" y="64" font-size="32" font-weight="600" fill="#161616">Một Input luôn có nhiều trạng thái, không chỉ Default</text>
  <text x="64" y="100" font-size="17" fill="#525252">Chỉ vẽ trạng thái mặc định là lỗi phổ biến nhất của người mới</text>
  <g transform="translate(64 148)">
    <text x="0" y="20" font-size="16" font-weight="600" fill="#161616">1. Default</text>
    <text x="0" y="48" font-size="13" fill="#525252">Email</text>
    <rect x="0" y="58" width="220" height="40" fill="#F4F4F4"/>
    <rect x="0" y="96" width="220" height="2" fill="#8D8D8D"/>
    <text x="12" y="84" font-size="14" fill="#A8A8A8">name@example.com</text>
    <text x="0" y="124" font-size="13" fill="#525252">Chưa có thao tác</text>
  </g>
  <g transform="translate(348 148)">
    <text x="0" y="20" font-size="16" font-weight="600" fill="#161616">2. Focus</text>
    <text x="0" y="48" font-size="13" fill="#525252">Email</text>
    <rect x="0" y="58" width="220" height="40" fill="#FFFFFF"/>
    <rect x="1" y="59" width="218" height="38" fill="none" stroke="#0F62FE" stroke-width="2"/>
    <text x="12" y="84" font-size="14" fill="#161616">dat@dotb.vn</text>
    <text x="0" y="124" font-size="13" fill="#525252">Đang nhập, viền nhấn màu xanh</text>
  </g>
  <g transform="translate(632 148)">
    <text x="0" y="20" font-size="16" font-weight="600" fill="#161616">3. Error</text>
    <text x="0" y="48" font-size="13" fill="#525252">Email</text>
    <rect x="0" y="58" width="220" height="40" fill="#F4F4F4"/>
    <rect x="0" y="96" width="220" height="2" fill="#DA1E28"/>
    <text x="12" y="84" font-size="14" fill="#161616">dat@</text>
    <text x="0" y="124" font-size="13" fill="#DA1E28">Lỗi: email chưa đúng định dạng</text>
  </g>
  <g transform="translate(916 148)">
    <text x="0" y="20" font-size="16" font-weight="600" fill="#161616">4. Disabled</text>
    <text x="0" y="48" font-size="13" fill="#A8A8A8">Email</text>
    <rect x="0" y="58" width="220" height="40" fill="#F4F4F4"/>
    <rect x="0" y="96" width="220" height="2" fill="#C6C6C6"/>
    <text x="12" y="84" font-size="14" fill="#C6C6C6">dat@dotb.vn</text>
    <text x="0" y="124" font-size="13" fill="#525252">Không thể chỉnh sửa</text>
  </g>
  <text x="64" y="326" font-size="15" fill="#525252">Mỗi trạng thái phải nói được cho người dùng: hiện tại hệ thống đang ở đâu.</text>
</svg>
