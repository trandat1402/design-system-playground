<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Các trạng thái Primary Button</title><desc id="d">Default, hover, active và disabled theo token Ant Design v5.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.label{font-size:12px;font-weight:500;fill:rgba(0,0,0,.65)}.title{font-size:16px;font-weight:600;fill:rgba(0,0,0,.88)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="340" fill="#f5f5f5"/><text class="h" x="48" y="52">Primary Button có nhiều state</text><text class="sub" x="48" y="82">Cùng một component, mỗi state dùng token đúng để phản hồi tương tác.</text><g transform="translate(48 124)"><rect width="252" height="156" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" x="24" y="36">Default</text><rect x="24" y="64" width="164" height="32" rx="6" fill="#1677ff"/><text x="66" y="85" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" x="24" y="126">#1677FF</text></g><g transform="translate(324 124)"><rect width="252" height="156" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" x="24" y="36">Hover</text><rect x="24" y="64" width="164" height="32" rx="6" fill="#4096ff"/><text x="66" y="85" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" x="24" y="126">#4096FF</text></g><g transform="translate(600 124)"><rect width="252" height="156" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" x="24" y="36">Active</text><rect x="24" y="64" width="164" height="32" rx="6" fill="#0958d9"/><text x="66" y="85" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" x="24" y="126">#0958D9</text></g><g transform="translate(876 124)"><rect width="276" height="156" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" x="24" y="36">Disabled</text><rect x="24" y="64" width="164" height="32" rx="6" fill="rgba(0,0,0,.04)"/><text x="66" y="85" font-size="14" font-weight="500" fill="rgba(0,0,0,.25)">Lưu thay đổi</text><text class="mono" x="24" y="126">rgba(0,0,0,.04)</text></g></svg>