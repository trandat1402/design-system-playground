<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Các trạng thái Primary Button</title><desc id="d">Default, hover, active, disabled có line box và text căn trục giữa.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;dominant-baseline:middle}.h{font-size:30px;font-weight:600;fill:rgba(0,0,0,.88)}.sub{font-size:14px;fill:rgba(0,0,0,.45)}.title{font-size:16px;font-weight:600;fill:rgba(0,0,0,.88)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;fill:rgba(0,0,0,.65)}</style><rect width="1200" height="340" fill="#f5f5f5"/><text class="h" x="48" y="48">Primary Button có nhiều state</text><text class="sub" x="48" y="80">Mỗi cột dùng cùng line box: label, control và token value.</text><g><rect x="48" y="120" width="252" height="160" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" text-anchor="middle" x="174" y="156">Default</text><rect x="92" y="184" width="164" height="32" rx="6" fill="#1677ff"/><text text-anchor="middle" x="174" y="200" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" text-anchor="middle" x="174" y="248">#1677FF</text></g><g><rect x="324" y="120" width="252" height="160" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" text-anchor="middle" x="450" y="156">Hover</text><rect x="368" y="184" width="164" height="32" rx="6" fill="#4096ff"/><text text-anchor="middle" x="450" y="200" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" text-anchor="middle" x="450" y="248">#4096FF</text></g><g><rect x="600" y="120" width="252" height="160" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" text-anchor="middle" x="726" y="156">Active</text><rect x="644" y="184" width="164" height="32" rx="6" fill="#0958d9"/><text text-anchor="middle" x="726" y="200" font-size="14" font-weight="500" fill="#fff">Lưu thay đổi</text><text class="mono" text-anchor="middle" x="726" y="248">#0958D9</text></g><g><rect x="876" y="120" width="276" height="160" rx="8" fill="#fff" stroke="#f0f0f0"/><text class="title" text-anchor="middle" x="1014" y="156">Disabled</text><rect x="932" y="184" width="164" height="32" rx="6" fill="rgba(0,0,0,.04)"/><text text-anchor="middle" x="1014" y="200" font-size="14" font-weight="500" fill="rgba(0,0,0,.25)">Lưu thay đổi</text><text class="mono" text-anchor="middle" x="1014" y="248">rgba(0,0,0,.04)</text></g></svg>