l="#fff" stroke="#d9d9d9"/><text class="ey" x="876" y="170">DISABLED</text><rect x="876" y="190" width="204" height="40" rx="6" fill="rgba(0,0,0,.04)"/><text text-anchor="middle" x="978" y="210" font-size="14" font-weight="500" fill="rgba(0,0,0,.25)">Primary</text><text class="mono" x="876" y="254">rgba(0,0,0,.04)</text></g></svg>