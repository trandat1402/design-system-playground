<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">From primitive color to semantic token</title><desc id="desc">Ba lớp color primitive, semantic token và component theo phong cách TailGrids v3.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#090E34" flood-opacity=".10"/></filter></defs><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.h{font-size:30px;font-weight:700;letter-spacing:-.02em;fill:#090E34}.sub{font-size:14px;fill:#6B7280}.label{font-size:12px;font-weight:600;letter-spacing:.05em;fill:#3758F9}.ct{font-size:16px;font-weight:600;letter-spacing:-.01em;fill:#1F2937}.body{font-size:13px;fill:#6B7280}.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;fill:#374151}</style><rect width="1200" height="360" fill="#F9FAFB"/><text class="h" x="48" y="52">From primitive color to semantic token</text><text class="sub" x="48" y="84">Use names that describe intent, so a component never depends on a raw color value.</text><rect x="48" y="120" width="1104" height="192" rx="8" fill="#FFF" stroke="#E5E7EB" filter="url(#s)"/><g transform="translate(72 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="56" height="24" rx="4" fill="#EEF2FF"/><text class="label" x="26" y="32">RAW</text><rect x="16" y="64" width="48" height="48" rx="8" fill="#3758F9"/><text class="ct" x="80" y="82">Primary blue</text><text class="mono" x="80" y="105">#3758F9</text><text class="body" x="16" y="130">A visual value</text></g><text x="404" y="224" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="600" fill="#3758F9">→</text><g transform="translate(440 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="72" height="24" rx="4" fill="#EEF2FF"/><text class="label" x="26" y="32">TOKEN</text><text class="ct" x="16" y="82">Semantic role</text><text class="mono" x="16" y="106">color.action.primary</text><text class="body" x="16" y="130">A product decision</text></g><text x="772" y="224" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="600" fill="#3758F9">→</text><g transform="translate(808 144)"><rect width="320" height="144" rx="8" fill="#FFF" stroke="#E5E7EB"/><rect x="16" y="16" width="88" height="24" rx="4" fill="#EEF2FF"/><text class="label" x="26" y="32">COMPONENT</text><text class="ct" x="16" y="82">Primary Button</text><rect x="16" y="98" width="144" height="36" rx="8" fill="#3758F9"/><text x="48" y="121" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500" fill="#FFF">Save changes</text></g></svg>